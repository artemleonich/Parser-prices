<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PriceRadar{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/dashboard" class="logo">PriceRadar</a>
            <div class="nav-right">
                {% if user %}
                <span class="user-info">{{ user.first_name }} ({{ user.subscription_plan.value }})</span>
                {% else %}
                <div id="telegram-login"></div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 PriceRadar &mdash; Мониторинг цен на маркетплейсах</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
